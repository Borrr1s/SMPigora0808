<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMP eSports — Результаты</title>
  <style>
    :root{
      --flag-white: #FFFFFF;
      --flag-blue: #0039A6;
      --flag-red: #D52B1E;
      --bg-dark: #0b0e14;
      --card-bg: #151a24;
      --card-inner: #1c2331;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-blue: #0039A6;
      --border: #2e384d;
      --row-gap: 8px;
      --row-padding: 10px 14px;
      --row-radius: 8px;
      --row-border: 1px solid var(--border);
      --font-main: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      --visible-rows: 15; /* 5 fixed + 10 rotating */
      --fixed-size: 5;
      --visible-rotating: 10;
      --site-max-width: 980px;
    }

    *{box-sizing: border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      background:var(--bg-dark);
      color:var(--text-main);
      font-family:var(--font-main);
      padding:20px;
      /* Use normal flow and center content with margin auto to avoid flex centering issues */
    }

    /* Center the main content and keep a consistent max width */
    .site-container{ max-width: var(--site-max-width); margin: 0 auto; }

    .wrap{
      width:100%;
      background:var(--card-bg);
      border-radius:12px;
      border:1px solid var(--border);
      padding:20px;
      box-shadow:0 12px 30px rgba(0,0,0,0.6);
    }

    /* Флаг и верхняя шапка */
    .tricolor-bar {
      width: 100%;
      height: 6px;
      display: flex;
      border-radius: 4px 4px 0 0;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .tricolor-bar div { flex: 1; }
    .tricolor-white { background-color: var(--flag-white); }
    .tricolor-blue { background-color: var(--flag-blue); }
    .tricolor-red { background-color: var(--flag-red); }

    /* colorful header with logo */
    .main-header{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:8px}
    .brand-left{display:flex;align-items:center;gap:14px}
    .brand-left img{height:56px;width:auto;display:block}
    .brand-title{display:flex;flex-direction:column}
    .brand-title h1{margin:0;font-size:24px;letter-spacing:2px;font-weight:900;color:var(--text-main);}
    .brand-title p{margin:0;color:#3b82f6;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}

    /* status badge on right */
    .status-compact{display:flex;align-items:center;gap:10px}
    .status-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block;border:2px solid rgba(255,255,255,0.06)}
    .status-text{color:var(--text-muted);font-weight:700}

    /* board styles */
    .board{
      background:var(--card-inner);
      border-radius:8px;
      padding:12px;
      border-left:5px solid var(--accent-blue);
      margin-top:8px;
    }

    .columns{
      display:grid;
      grid-template-columns: 80px 1fr 160px;
      gap:10px;
      align-items:center;
      padding:8px 12px;
      color:var(--text-muted);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:0.6px;
    }

    /* Containers for rows */
    .rows-area{ margin-top:8px; display:flex; flex-direction:column; gap:var(--row-gap); }

    .rows-fixed, .rows-rotating{ display:grid; gap:var(--row-gap); }

    /* Row card */
    .row{
      display:grid;
      grid-template-columns: 80px 1fr 160px;
      align-items:center;
      gap:10px;
      padding:var(--row-padding);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
      border-radius:var(--row-radius);
      border:var(--row-border);
      transition: transform 650ms cubic-bezier(.2,.9,.3,1), opacity 600ms ease, box-shadow 600ms ease;
      font-size:16px; /* увеличенный шрифт */
      will-change: transform, opacity, box-shadow;
    }

    .row .pos{ font-weight:800; text-align:center; font-size:18px; width:80px; color:var(--text-main) }
    .row .name{ color:var(--text-main); font-weight:700 }
    .row .time{ text-align:right; font-family: 'Consolas', 'Courier New', monospace; color:var(--accent); font-weight:800; font-size:17px }

    /* special colors for top3 */
    .row.top-1 .pos{ color: #ffd700 }
    .row.top-2 .pos{ color: #e2e8f0 }
    .row.top-3 .pos{ color: #cd7f32 }

    /* Area sizing to fit exactly 15 rows without internal scroll */
    .rows-fixed { grid-auto-rows: 56px; } /* 5 rows * 56 = 280px */
    .rows-rotating { grid-auto-rows: 56px; } /* 10 rows * 56 = 560px */

    /* Blank slots (no framing) */
    .blank-slot{height:56px;}
    @media (max-width:720px){ .blank-slot{height:48px} }

    /* Animation classes used during swap */
    .fade-out { opacity:0; transform: translateY(-8px) scale(.995); }
    .fade-in { opacity:1; transform: translateY(0) scale(1); }

    /* highlight new rows */
    @keyframes glowPop{
      0%{ box-shadow: 0 0 0 rgba(16,185,129,0); transform: scale(0.995); }
      40%{ box-shadow: 0 6px 24px rgba(16,185,129,0.08); transform: scale(1.01); }
      100%{ box-shadow: 0 0 0 rgba(16,185,129,0); transform: scale(1); }
    }
    .new-row{ animation: glowPop 800ms ease; }

    /* Placeholder style (framed empty) */
    .empty { color:var(--text-muted); font-weight:600; opacity:0.9 }

    /* Responsive adjustments */
    @media (max-width:720px){
      .columns{grid-template-columns:64px 1fr 120px}
      .row{grid-template-columns:64px 1fr 120px; font-size:14px}
      .row .pos{font-size:16px}
      .row .time{font-size:15px}
      .rows-fixed, .rows-rotating { grid-auto-rows:48px }
      .brand-left img{height:44px}
    }
  </style>
</head>
<body>
  <div class="site-container">
    <div class="wrap" role="main">

      <div class="tricolor-bar">
        <div class="tricolor-white"></div>
        <div class="tricolor-blue"></div>
        <div class="tricolor-red"></div>
      </div>

      <div class="main-header">
        <div class="brand-left">
          <!-- Place leaderboard/logo.png in the repo (leaderboard/logo.png) or change src to your hosted URL -->
          <img src="/leaderboard/logo.png" alt="SMP eSports logo" onerror="this.style.display='none'" />
          <div class="brand-title">
            <h1>🏎️ SMP eSports</h1>
            <p>РЕГИСТРАЦИЯ ЛУЧШЕГО ВРЕМЕНИ КРУГА</p>
          </div>
        </div>
        <div class="status-compact"><span class="status-dot" id="statusDot"></span><span class="status-text" id="statusText">Загрузка...</span></div>
      </div>

      <div class="board" aria-live="polite" aria-atomic="true">
        <div class="columns">
          <div>№</div><div>Фамилия Имя</div><div style="text-align:right">Лучшее время круга</div>
        </div>

        <div class="rows-area">
          <div class="rows-fixed" id="fixedRows" aria-hidden="false"></div>
          <div class="rows-rotating" id="rotatingRows" aria-hidden="false"></div>
        </div>
      </div>

      <footer style="margin-top:12px;color:var(--text-muted);font-size:13px">Обновление данных: каждые 10 с • Прокрутка: каждые 10 с (шаг 10)</footer>
    </div>
  </div>

  <script>
    // CSV-экспорт листа (gid=0)
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/1Q2DDOwHC-v1ewo1d70qjFdmsEXY-e7p0xJ1NyrJyFzw/export?format=csv&gid=0';

    const FIXED_SIZE = 5;
    const VISIBLE_ROTATING = 10;
    const ROTATE_STEP = 10; // сдвиг на 10 строк
    const UPDATE_INTERVAL = 10000; // 10s
    const ROTATE_INTERVAL = 10000; // 10s

    const fixedEl = document.getElementById('fixedRows');
    const rotatingEl = document.getElementById('rotatingRows');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    let allRows = []; // {position, name, timeRaw, timeMs}
    let rotatePage = 0; // page index (each page shifts by ROTATE_STEP)

    // CSV парсер (поддержка кавычек)
    function splitCsvLine(line){
      const res=[]; let cur='', inQuotes=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){
          if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; }
          else inQuotes=!inQuotes;
          continue;
        }
        if(ch===',' && !inQuotes){ res.push(cur); cur=''; continue; }
        cur+=ch;
      }
      res.push(cur);
      return res;
    }
    function parseCSV(text){
      const lines=text.split(/\r?\n/).filter(Boolean);
      if(lines.length===0) return [];
      const headers = splitCsvLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
      const rows=[];
      for(let i=1;i<lines.length;i++){
        const cols=splitCsvLine(lines[i]);
        if(cols.length===0) continue;
        const obj={};
        for(let j=0;j<headers.length;j++){
          obj[headers[j]] = (cols[j]||'').trim().replace(/^"|"$/g,'');
        }
        rows.push(obj);
      }
      return rows;
    }

    function parseTimeToMs(s){
      if(!s) return null;
      s=String(s).trim().replace(',', '.');
      const mmss = s.match(/^(\d+):(\d{1,2})[.,]?(\d{1,3})?$/);
      if(mmss){
        const m=Number(mmss[1]), sec=Number(mmss[2]), ms=mmss[3]?Number((mmss[3]+'000').slice(0,3)):0;
        return (m*60+sec)*1000 + ms;
      }
      const secOnly = s.match(/^(\d+)[.,]?(\d{1,3})?$/);
      if(secOnly){
        const sec=Number(secOnly[1]), ms=secOnly[2]?Number((secOnly[2]+'000').slice(0,3)):0;
        return sec*1000 + ms;
      }
      return null;
    }
    function formatMs(ms){
      if(ms==null) return '—';
      const minutes = Math.floor(ms/60000);
      const seconds = Math.floor((ms%60000)/1000);
      const millis = ms%1000;
      if(minutes>0) return `${minutes}:${String(seconds).padStart(2,'0')}.${String(millis).padStart(3,'0')}`;
      return `${seconds}.${String(millis).padStart(3,'0')}`;
    }

    function mapRow(r, idx){
      const keys = Object.keys(r);
      let nameKey = keys.find(k => /name|fullname|фамилия|имя|фio|fio|фамилия имя/.test(k));
      let timeKey = keys.find(k => /time|lap|время|круг|best|besttime/.test(k));
      let posKey = keys.find(k => /pos|position|№|rank|место/.test(k));

      if(!nameKey){ nameKey = keys.find(k => /[а-яa-z]/i.test(r[k]) && !/\d/.test(r[k])); }
      if(!timeKey){ timeKey = keys.find(k => /\d+[:.,]\d+/.test(r[k]||'')); }

      const name = nameKey ? r[nameKey] : (r[keys[0]]||'—');
      const timeRaw = timeKey ? r[timeKey] : '';
      const pos = posKey ? (r[posKey]||'').replace(/[^\d]/g,'') : '';
      const timeMs = parseTimeToMs(timeRaw);

      return { pos: pos?Number(pos):null, name: name||'—', timeRaw: timeRaw||'', timeMs };
    }

    async function fetchAndPrepare(){
      try{
        const res = await fetch(SHEET_CSV, {cache:'no-store'});
        if(!res.ok) throw new Error('network');
        const text = await res.text();
        const parsed = parseCSV(text);
        const mapped = parsed.map(mapRow).filter(r => r.name && (r.timeRaw || r.timeMs!=null));

        const hasPos = mapped.some(r=>r.pos!==null && !isNaN(r.pos));
        if(hasPos){
          mapped.sort((a,b)=>{
            if(a.pos!==null && b.pos!==null) return a.pos - b.pos;
            if(a.timeMs!=null && b.timeMs!=null) return a.timeMs - b.timeMs;
            return 0;
          });
        } else {
          mapped.sort((a,b)=>{
            if(a.timeMs==null && b.timeMs==null) return 0;
            if(a.timeMs==null) return 1;
            if(b.timeMs==null) return -1;
            return a.timeMs - b.timeMs;
          });
        }
        allRows = mapped.map((r,i)=>({ ...r, position: i+1 }));
        statusText.textContent = `Онлайн • ${allRows.length} записей • обновление каждые 10 с`;
        statusDot.style.background = 'var(--accent)';
      }catch(e){
        console.error(e);
        statusText.textContent = 'Ошибка загрузки данных';
        statusDot.style.background = '#ff5a5f';
        allRows = [];
      }
    }

    // render helpers
    function createRowElement(objOrNull){
      const tr = document.createElement('div');
      tr.className = 'row';
      if(!objOrNull){
        tr.innerHTML = `<div class="pos empty">—</div><div class="name empty">—</div><div class="time empty">—</div>`;
      } else {
        const classes = ['row'];
        if(objOrNull.position === 1) classes.push('top-1');
        if(objOrNull.position === 2) classes.push('top-2');
        if(objOrNull.position === 3) classes.push('top-3');
        tr.className = classes.join(' ');
        const timeText = objOrNull.timeMs!=null ? formatMs(objOrNull.timeMs) : (objOrNull.timeRaw || '—');
        tr.innerHTML = `<div class="pos">${objOrNull.position}</div><div class="name">${escapeHtml(objOrNull.name)}</div><div class="time">${escapeHtml(timeText)}</div>`;
      }
      return tr;
    }
    function createBlankSlot(){
      const el = document.createElement('div');
      el.className = 'blank-slot';
      return el;
    }

    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // initial render: fixed top 5 + first rotating page
    function renderInitial(){
      fixedEl.innerHTML = '';
      rotatingEl.innerHTML = '';

      if(allRows.length===0){
        for(let i=0;i<FIXED_SIZE;i++) fixedEl.appendChild(createRowElement(null));
        for(let i=0;i<VISIBLE_ROTATING;i++) rotatingEl.appendChild(createBlankSlot());
        return;
      }

      const fixed = allRows.slice(0, FIXED_SIZE);
      for(let i=0;i<FIXED_SIZE;i++){
        const r = fixed[i];
        fixedEl.appendChild(createRowElement(r || null));
      }

      renderRotatingPage(0, true);
    }

    function renderRotatingPage(pageIndex, noAnim){
      rotatingEl.classList.remove('fade-in','fade-out');
      const restAll = allRows.slice(FIXED_SIZE);
      const pages = Math.max(1, Math.ceil(restAll.length / ROTATE_STEP));
      const start = pageIndex * ROTATE_STEP;
      const slice = restAll.slice(start, start + VISIBLE_ROTATING);

      // build rows (do NOT wrap-around). pad with blanks to VISIBLE_ROTATING
      const rows = slice.slice(0, VISIBLE_ROTATING);
      while(rows.length < VISIBLE_ROTATING) rows.push(null);

      if(noAnim){
        rotatingEl.innerHTML = '';
        rows.forEach(r => rotatingEl.appendChild(r?createRowElement(r):createBlankSlot()));
        return;
      }

      rotatingEl.classList.add('fade-out');
      setTimeout(()=>{
        rotatingEl.innerHTML = '';
        rows.forEach(r => {
          const el = r?createRowElement(r):createBlankSlot();
          rotatingEl.appendChild(el);
          if(r) {
            // slight staggered highlight for newly shown rows
            setTimeout(()=> el.classList.add('new-row'), 80);
            setTimeout(()=> el.classList.remove('new-row'), 900);
          }
        });
        rotatingEl.classList.remove('fade-out');
        rotatingEl.classList.add('fade-in');
        setTimeout(()=> rotatingEl.classList.remove('fade-in'), 820);
      }, 380); // shorter delay for smoother feel
    }

    // rotation step: advance pageIndex each tick
    function startRotation(){
      setInterval(()=>{
        const restAll = allRows.slice(FIXED_SIZE);
        const pages = Math.max(1, Math.ceil(restAll.length / ROTATE_STEP));
        if(pages === 0) return;
        rotatePage = (rotatePage + 1) % pages;
        renderRotatingPage(rotatePage, false);
      }, ROTATE_INTERVAL);
    }

    // periodic data refresh
    function startUpdater(){
      setInterval(async ()=>{
        await fetchAndPrepare();
        // re-render fixed top
        fixedEl.innerHTML = '';
        const fixed = allRows.slice(0, FIXED_SIZE);
        for(let i=0;i<FIXED_SIZE;i++){
          const r = fixed[i];
          fixedEl.appendChild(createRowElement(r || null));
        }
        // clamp rotatePage
        const restAll = allRows.slice(FIXED_SIZE);
        const pages = Math.max(1, Math.ceil(restAll.length / ROTATE_STEP));
        rotatePage = rotatePage % pages;
        renderRotatingPage(rotatePage, false);
      }, UPDATE_INTERVAL);
    }

    (async function init(){
      await fetchAndPrepare();
      rotatePage = 0;
      renderInitial();
      startRotation();
      startUpdater();
    })();

  </script>
</body>
</html>
