<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMP eSports — Результаты</title>
  <style>
    :root{
      --flag-white: #FFFFFF;
      --flag-blue: #0039A6;
      --flag-red: #D52B1E;
      --bg-dark: #0b0e14;
      --card-bg: #151a24;
      --card-inner: #1c2331;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-blue: #0039A6;
      --border: #2e384d;
      --row-gap: 8px;
      --row-padding: 10px 14px;
      --row-radius: 8px;
      --row-border: 1px solid var(--border);
      --font-main: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      --visible-rows: 15; /* 5 fixed + 10 rotating */
      --fixed-size: 5;
      --visible-rotating: 10;
      --site-max-width: 980px;
      --anim-duration: 820ms;
      --anim-ease: cubic-bezier(.16,.9,.28,1);
    }

    *{box-sizing: border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      background:var(--bg-dark);
      color:var(--text-main);
      font-family:var(--font-main);
      padding:20px;
    }

    /* center container */
    .site-container{ max-width: var(--site-max-width); margin: 0 auto; }

    .wrap{
      width:100%;
      background:var(--card-bg);
      border-radius:12px;
      border:1px solid var(--border);
      padding:20px;
      box-shadow:0 12px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .tricolor-bar { width: 100%; height: 6px; display: flex; border-radius: 4px 4px 0 0; overflow: hidden; margin-bottom: 12px; }
    .tricolor-bar div { flex: 1; }
    .tricolor-white { background-color: var(--flag-white); }
    .tricolor-blue { background-color: var(--flag-blue); }
    .tricolor-red { background-color: var(--flag-red); }

    .main-header{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:8px}
    .brand-left{display:flex;align-items:center;gap:14px}
    .brand-left img{height:56px;width:auto;display:block}
    .brand-title{display:flex;flex-direction:column}
    .brand-title h1{margin:0;font-size:24px;letter-spacing:2px;font-weight:900;color:var(--text-main);}
    .brand-title p{margin:0;color:#3b82f6;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}

    .status-compact{display:flex;align-items:center;gap:10px}
    .status-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block;border:2px solid rgba(255,255,255,0.06)}
    .status-text{color:var(--text-muted);font-weight:700}

    .board{ background:var(--card-inner); border-radius:8px; padding:12px; border-left:5px solid var(--accent-blue); margin-top:8px; }

    .columns{ display:grid; grid-template-columns: 80px 1fr 160px; gap:10px; align-items:center; padding:8px 12px; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:0.6px; }

    .rows-area{ margin-top:8px; display:flex; flex-direction:column; gap:var(--row-gap); }
    .rows-fixed, .rows-rotating{ display:grid; gap:var(--row-gap); }

    /* Row card */
    .row{ display:grid; grid-template-columns: 80px 1fr 160px; align-items:center; gap:10px; padding:var(--row-padding); background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03)); border-radius:var(--row-radius); border:var(--row-border); transition: transform 680ms var(--anim-ease), opacity 560ms ease, box-shadow 560ms ease; font-size:16px; will-change: transform, opacity, box-shadow; }

    .row .pos{ font-weight:800; text-align:center; font-size:18px; width:80px; color:var(--text-main) }
    .row .name{ color:var(--text-main); font-weight:700 }
    .row .time{ text-align:right; font-family: 'Consolas', 'Courier New', monospace; color:var(--accent); font-weight:800; font-size:17px }

    .row.top-1 .pos{ color: #ffd700 }
    .row.top-2 .pos{ color: #e2e8f0 }
    .row.top-3 .pos{ color: #cd7f32 }

    .rows-fixed { grid-auto-rows: 56px; }
    .rows-rotating { grid-auto-rows: 56px; }

    .blank-slot{height:56px;}
    @media (max-width:720px){ .blank-slot{height:48px} }

    .fade-out { opacity:0; transform: translateY(-4px) scale(.998); }
    .fade-in { opacity:1; transform: translateY(0) scale(1); }

    @keyframes glowPop{ 0%{ box-shadow: 0 0 0 rgba(16,185,129,0); transform: scale(0.997); } 40%{ box-shadow: 0 6px 20px rgba(16,185,129,0.06); transform: scale(1.007); } 100%{ box-shadow: 0 0 0 rgba(16,185,129,0); transform: scale(1); } }
    .new-row{ animation: glowPop 700ms ease; }

    .empty { color:var(--text-muted); font-weight:600; opacity:0.9 }

    /* reduced-motion / low-perf fallback */
    .reduced-motion .row{ transition: none !important; }
    .reduced-motion .new-row{ animation: none !important; }
    .reduced-motion .fade-out, .reduced-motion .fade-in { transition: none !important; }

    @media (max-width:720px){ .columns{grid-template-columns:64px 1fr 120px} .row{grid-template-columns:64px 1fr 120px; font-size:14px} .row .pos{font-size:16px} .row .time{font-size:15px} .rows-fixed, .rows-rotating { grid-auto-rows:48px } .brand-left img{height:44px} }
  </style>
</head>
<body>
  <div class="site-container">
    <div class="wrap" role="main">

      <div class="tricolor-bar">
        <div class="tricolor-white"></div>
        <div class="tricolor-blue"></div>
        <div class="tricolor-red"></div>
      </div>

      <div class="main-header">
        <div class="brand-left">
          <!-- use relative path so it works when hosted under /repo/leaderboard/ -->
          <img src="./logo.png" alt="SMP eSports logo" onerror="this.style.display='none'" />
          <div class="brand-title">
            <h1>🏎️ SMP eSports</h1>
            <p>РЕГИСТРАЦИЯ ЛУЧШЕГО ВРЕМЕНИ КРУГА</p>
          </div>
        </div>
        <div class="status-compact"><span class="status-dot" id="statusDot"></span><span class="status-text" id="statusText">Загрузка...</span></div>
      </div>

      <div class="board" aria-live="polite" aria-atomic="true">
        <div class="columns">
          <div>№</div><div>Фамилия Имя</div><div style="text-align:right">Лучшее время круга</div>
        </div>

        <div class="rows-area">
          <div class="rows-fixed" id="fixedRows" aria-hidden="false"></div>
          <div class="rows-rotating" id="rotatingRows" aria-hidden="false"></div>
        </div>
      </div>

      <footer style="margin-top:12px;color:var(--text-muted);font-size:13px">Обновление данных: каждые 10 с • Прокрутка: каждые 10 с (шаг 10)</footer>
    </div>
  </div>

  <script>
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/1Q2DDOwHC-v1ewo1d70qjFdmsEXY-e7p0xJ1NyrJyFzw/export?format=csv&gid=0';

    const FIXED_SIZE = 5;
    const VISIBLE_ROTATING = 10;
    const ROTATE_STEP = 10; // page size
    const UPDATE_INTERVAL = 10000; // 10s
    const ROTATE_INTERVAL = 10000; // 10s

    const fixedEl = document.getElementById('fixedRows');
    const rotatingEl = document.getElementById('rotatingRows');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    let allRows = [];
    let rotatePage = 0;

    // timers
    let rotationTimer = null;
    let updating = false;

    // reduced motion / low perf detection
    (function(){
      try{
        const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const lowPerf = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) || (navigator.deviceMemory && navigator.deviceMemory <= 1);
        if(prefersReduced || lowPerf){ document.documentElement.classList.add('reduced-motion'); }
      }catch(e){ /* ignore */ }
    })();

    function splitCsvLine(line){
      const res=[]; let cur='', inQuotes=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){
          if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; }
          else inQuotes=!inQuotes;
          continue;
        }
        if(ch===',' && !inQuotes){ res.push(cur); cur=''; continue; }
        cur+=ch;
      }
      res.push(cur);
      return res;
    }
    function parseCSV(text){
      const lines=text.split(/\r?\n/);
      if(lines.length===0) return [];
      const headers = splitCsvLine(lines[0]||'').map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
      const rows=[];
      for(let i=1;i<lines.length;i++){
        if(!lines[i]){ continue; }
        const cols=splitCsvLine(lines[i]);
        if(cols.length===0) continue;
        const obj={};
        for(let j=0;j<headers.length;j++){
          obj[headers[j]] = (cols[j]||'').trim().replace(/^"|"$/g,'');
        }
        rows.push(obj);
      }
      return rows;
    }

    function parseTimeToMs(s){
      if(!s) return null;
      s=String(s).trim().replace(',', '.');
      const mmss = s.match(/^(\d+):(\d{1,2})[.,]?(\d{1,3})?$/);
      if(mmss){
        const m=Number(mmss[1]), sec=Number(mmss[2]), ms=mmss[3]?Number((mmss[3]+'000').slice(0,3)):0;
        return (m*60+sec)*1000 + ms;
      }
      const secOnly = s.match(/^(\d+)[.,]?(\d{1,3})?$/);
      if(secOnly){
        const sec=Number(secOnly[1]), ms=secOnly[2]?Number((secOnly[2]+'000').slice(0,3)):0;
        return sec*1000 + ms;
      }
      return null;
    }
    function formatMs(ms){
      if(ms==null) return '—';
      const minutes = Math.floor(ms/60000);
      const seconds = Math.floor((ms%60000)/1000);
      const millis = ms%1000;
      if(minutes>0) return `${minutes}:${String(seconds).padStart(2,'0')}.${String(millis).padStart(3,'0')}`;
      return `${seconds}.${String(millis).padStart(3,'0')}`;
    }

    function mapRow(r){
      const keys = Object.keys(r);
      let nameKey = keys.find(k => /name|fullname|фамилия|имя|фio|fio|фамилия имя/.test(k));
      let timeKey = keys.find(k => /time|lap|время|круг|best|besttime/.test(k));
      let posKey = keys.find(k => /pos|position|№|rank|место/.test(k));
      if(!nameKey){ nameKey = keys.find(k => /[а-яa-z]/i.test(r[k]) && !/\d/.test(r[k])); }
      if(!timeKey){ timeKey = keys.find(k => /\d+[:.,]\d+/.test(r[k]||'')); }
      const name = nameKey ? r[nameKey] : (r[keys[0]]||'—');
      const timeRaw = timeKey ? r[timeKey] : '';
      const pos = posKey ? (r[posKey]||'').replace(/[^\d]/g,'') : '';
      const timeMs = parseTimeToMs(timeRaw);
      return { pos: pos?Number(pos):null, name: name||'—', timeRaw: timeRaw||'', timeMs };
    }

    async function fetchAndPrepare(){
      try{
        const res = await fetch(SHEET_CSV, {cache:'no-store'});
        if(!res.ok) throw new Error('network');
        const text = await res.text();
        const parsed = parseCSV(text);
        const mapped = parsed.map(mapRow).filter(r => r.name && (r.timeRaw || r.timeMs!=null));
        const hasPos = mapped.some(r=>r.pos!==null && !isNaN(r.pos));
        if(hasPos){
          mapped.sort((a,b)=>{
            if(a.pos!==null && b.pos!==null) return a.pos - b.pos;
            if(a.timeMs!=null && b.timeMs!=null) return a.timeMs - b.timeMs;
            return 0;
          });
        } else {
          mapped.sort((a,b)=>{
            if(a.timeMs==null && b.timeMs==null) return 0;
            if(a.timeMs==null) return 1;
            if(b.timeMs==null) return -1;
            return a.timeMs - b.timeMs;
          });
        }
        allRows = mapped.map((r,i)=>({ ...r, position: i+1 }));
        statusText.textContent = `Онлайн • ${allRows.length} записей • обновление каждые 10 с`;
        statusDot.style.background = 'var(--accent)';
        return true;
      }catch(e){
        console.error(e);
        statusText.textContent = 'Ошибка загрузки данных';
        statusDot.style.background = '#ff5a5f';
        allRows = [];
        return false;
      }
    }

    // element pools (allow blank slots)
    const fixedEls = [];
    const rotatingEls = [];

    function makeRowEl(){
      const el = document.createElement('div');
      el.className = 'row';
      el.innerHTML = `<div class="pos">—</div><div class="name">—</div><div class="time">—</div>`;
      return el;
    }
    function makeBlankEl(){ const el = document.createElement('div'); el.className = 'blank-slot'; return el; }

    function ensurePools(){
      // fixed
      while(fixedEls.length < FIXED_SIZE){ const el = makeRowEl(); fixedEls.push(el); fixedEl.appendChild(el); }
      // rotating
      while(rotatingEls.length < VISIBLE_ROTATING){ const el = makeRowEl(); rotatingEls.push(el); rotatingEl.appendChild(el); }
    }

    function replaceEl(parent, oldEl, newEl, indexArray, idx){
      parent.replaceChild(newEl, oldEl);
      indexArray[idx] = newEl;
    }

    function updateRowElement(el, data){
      if(!data){
        el.className = 'row';
        el.querySelector('.pos').textContent = '—';
        el.querySelector('.name').textContent = '—';
        el.querySelector('.time').textContent = '—';
        return;
      }
      const classes = ['row'];
      if(data.position === 1) classes.push('top-1');
      if(data.position === 2) classes.push('top-2');
      if(data.position === 3) classes.push('top-3');
      el.className = classes.join(' ');
      el.querySelector('.pos').textContent = data.position;
      el.querySelector('.name').textContent = data.name;
      el.querySelector('.time').textContent = data.timeMs!=null ? formatMs(data.timeMs) : (data.timeRaw || '—');
    }

    function renderInitial(){
      fixedEl.innerHTML = '';
      rotatingEl.innerHTML = '';
      fixedEls.length = 0; rotatingEls.length = 0;
      ensurePools();

      const fixed = allRows.slice(0, FIXED_SIZE);
      for(let i=0;i<FIXED_SIZE;i++){ updateRowElement(fixedEls[i], fixed[i] || null); }
      renderRotatingPage(0, true);
    }

    function renderRotatingPage(pageIndex, noAnim){
      const restAll = allRows.slice(FIXED_SIZE);
      const pages = Math.max(1, Math.ceil(restAll.length / ROTATE_STEP));
      const start = pageIndex * ROTATE_STEP;
      const slice = restAll.slice(start, start + VISIBLE_ROTATING);
      const rows = slice.slice(0, VISIBLE_ROTATING);
      while(rows.length < VISIBLE_ROTATING) rows.push(null);

      rows.forEach((r, i)=>{
        const current = rotatingEls[i];
        if(r === null){
          // need blank slot
          if(!current.classList.contains('blank-slot')){
            const blank = makeBlankEl();
            replaceEl(rotatingEl, current, blank, rotatingEls, i);
          }
          // blank slot — nothing more to update
          return;
        }
        // ensure it's a row element
        if(current.classList.contains('blank-slot')){
          const rowEl = makeRowEl();
          replaceEl(rotatingEl, current, rowEl, rotatingEls, i);
          updateRowElement(rowEl, r);
          if(!noAnim){ rowEl.classList.add('fade-in'); setTimeout(()=>rowEl.classList.remove('fade-in'), 820); rowEl.classList.add('new-row'); setTimeout(()=>rowEl.classList.remove('new-row'), 900); }
          return;
        }
        // normal row -> animate update in place
        const el = rotatingEls[i];
        if(noAnim){ updateRowElement(el, r); return; }
        el.classList.add('fade-out');
        setTimeout(()=>{
          updateRowElement(el, r);
          el.classList.remove('fade-out');
          el.classList.add('fade-in');
          setTimeout(()=>el.classList.remove('fade-in'), 820);
          el.classList.add('new-row'); setTimeout(()=>el.classList.remove('new-row'), 900);
        }, 360);
      });
    }

    function startRotationLoop(){
      if(rotationTimer) clearTimeout(rotationTimer);
      rotationTimer = setTimeout(function tick(){
        const restAll = allRows.slice(FIXED_SIZE);
        const pages = Math.max(1, Math.ceil(restAll.length / ROTATE_STEP));
        if(pages > 0){ rotatePage = (rotatePage + 1) % pages; renderRotatingPage(rotatePage, false); }
        rotationTimer = setTimeout(tick, ROTATE_INTERVAL);
      }, ROTATE_INTERVAL);
    }

    async function refreshData(){
      if(updating) return;
      updating = true;
      if(rotationTimer){ clearTimeout(rotationTimer); rotationTimer = null; }
      const ok = await fetchAndPrepare();
      ensurePools();
      const fixed = allRows.slice(0, FIXED_SIZE);
      for(let i=0;i<FIXED_SIZE;i++){ updateRowElement(fixedEls[i], fixed[i] || null); }
      const restAll = allRows.slice(FIXED_SIZE);
      const pages = Math.max(1, Math.ceil(restAll.length / ROTATE_STEP));
      rotatePage = rotatePage % pages;
      renderRotatingPage(rotatePage, false);
      setTimeout(()=>{ startRotationLoop(); updating = false; }, 600);
    }

    function startUpdater(){ setInterval(()=>{ refreshData(); }, UPDATE_INTERVAL); }

    (async function init(){ await fetchAndPrepare(); ensurePools(); renderInitial(); startRotationLoop(); startUpdater(); })();

  </script>
</body>
</html>
