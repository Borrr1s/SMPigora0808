<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMP eSports — Регистрация времени круга</title>
  <style>
    :root {
      --flag-white: #FFFFFF;
      --flag-blue: #0039A6;
      --flag-red: #D52B1E;
      --bg-dark: #0b0e14;
      --card-bg: #151a24;
      --card-inner: #1c2331;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #2e384d;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Флаг РФ */
    .tricolor-bar {
      width: 100%;
      max-width: 980px;
      height: 6px;
      display: flex;
      border-radius: 4px 4px 0 0;
      overflow: hidden;
    }
    .tricolor-bar div { flex: 1; }
    .tricolor-white { background-color: var(--flag-white); }
    .tricolor-blue { background-color: var(--flag-blue); }
    .tricolor-red { background-color: var(--flag-red); }

    .container {
      width: 100%;
      max-width: 980px;
      background: var(--card-bg);
      border-radius: 0 0 12px 12px;
      padding: 28px 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border: 1px solid var(--border-color);
      border-top: none;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 30px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--flag-white);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header p {
      color: #3b82f6;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .form-card {
      background: var(--card-inner);
      padding: 22px;
      border-radius: 10px;
      border-left: 5px solid var(--flag-red);
      margin-bottom: 32px;
    }

    .form-card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    input {
      background: #111622;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    button {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--flag-blue), #002266);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(0, 57, 166, 0.4);
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .leaderboard-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .status-badge {
      font-size: 12px;
      color: var(--text-muted);
      background: #111622;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      display: inline-block;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-inner);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #111622;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .pos-col {
      font-weight: bold;
      width: 60px;
      text-align: center;
    }

    tr:nth-child(1) .pos-col { color: #ffd700; } /* 1 место - Золото */
    tr:nth-child(2) .pos-col { color: #e2e8f0; } /* 2 место - Серебро */
    tr:nth-child(3) .pos-col { color: #cd7f32; } /* 3 место - Бронза */

    .time-cell {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 700;
      color: var(--accent-green);
      font-size: 15px;
    }

    .comment-cell {
      color: var(--text-muted);
      font-style: italic;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 35px;
      color: var(--text-muted);
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .container { padding: 16px 12px; }
      header h1 { font-size: 22px; }
      td, th { padding: 10px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="tricolor-bar">
    <div class="tricolor-white"></div>
    <div class="tricolor-blue"></div>
    <div class="tricolor-red"></div>
  </div>

  <div class="container">
    <header>
      <h1>🏎️ SMP eSports</h1>
      <p>РЕГИСТРАЦИЯ ЛУЧШЕГО ВРЕМЕНИ КРУГА</p>
    </header>

    <div class="form-card">
      <h2>⏱️ Внести результат</h2>
      <form id="lapForm">
        <div class="form-grid">
          <div class="input-group">
            <label for="name">Фамилия Имя</label>
            <input type="text" id="name" placeholder="Иванов Иван" required>
          </div>
          <div class="input-group">
            <label for="phone">Номер телефона</label>
            <input type="tel" id="phone" placeholder="8 (999) 000-00-00" required>
          </div>
          <div class="input-group">
            <label for="lapTime">Время круга (ММ:СС.ммм)</label>
            <input type="text" id="lapTime" placeholder="1:23.456" required pattern="^(\d+:)?\d{1,2}[\.,]\d{1,3}$" title="Формат: 1:23.456 или 83.456">
          </div>
          <div class="input-group full-width">
            <label for="comment">Комментарий (необязательно)</label>
            <input type="text" id="comment" placeholder="Трасса, машина, штраф или примечание...">
          </div>
          <button type="submit" id="submitBtn">Отправить результат</button>
        </div>
      </form>
    </div>

    <div class="leaderboard-section">
      <div class="leaderboard-header">
        <h2>🏆 Таблица результатов</h2>
        <div class="status-badge">
          <span class="status-dot"></span>
          <span id="statusText">Загрузка...</span>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="pos-col">№</th>
              <th>Фамилия Имя</th>
              <th>Номер телефона</th>
              <th>Лучшее время круга</th>
              <th>Комментарий</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr>
              <td colspan="5" class="empty-state">Загрузка данных из Google Таблицы...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer>
      SMP eSports Timing System • Работает с Google Spreadsheets
    </footer>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2r-IQA9gDNhisw_E1PJ46EmnJ2ITpPthrX7gFkSgafcB4rb6nMwkcPGd_LaQ5rzxwog/exec";

    const lapForm = document.getElementById('lapForm');
    const submitBtn = document.getElementById('submitBtn');
    const leaderboardBody = document.getElementById('leaderboardBody');
    const statusText = document.getElementById('statusText');

    // Храним последнюю загруженную таблицу
    let leaderboardData = [];

    // Функция приведения номера телефона к формату начиная с 8
    function normalizePhone(phone) {
      let trimmed = phone.trim();
      // Убираем все кроме цифр и +
      //Сохраним знак + если есть
      const hasPlus = trimmed.startsWith('+');
      let digits = trimmed.replace(/[^\d]/g, '');
      if (hasPlus && trimmed.startsWith('+7')) {
        // +7 -> 8
        digits = '8' + digits.slice(1);
      } else if (digits.startsWith('7') && digits.length === 11) {
        digits = '8' + digits.slice(1);
      }
      // если уже 11 цифр и начинается с 8 - оставим
      if (digits.length === 11 && digits.startsWith('8')) return digits;
      return trimmed;
    }

    // Парсинг времени вида M:SS.mmm или SS.mmm в миллисекунды
    function timeToMs(t) {
      if (!t) return Infinity;
      t = String(t).trim().replace(',', '.');
      const parts = t.split(':');
      let ms = 0;
      if (parts.length === 2) {
        const min = parseInt(parts[0], 10) || 0;
        const rest = parseFloat(parts[1]) || 0;
        ms = (min * 60 + rest) * 1000;
      } else {
        const val = parseFloat(parts[0]) || 0;
        ms = val * 1000;
      }
      return Math.round(ms);
    }

    // Нормализация ФИО для сравнения (удаляем небуквы, пробелы, нижний регистр)
    function normalizeName(name) {
      return String(name || '').toLowerCase().replace(/[^а-яa-zё]/gi, '').trim();
    }

    // Больше мягкая проверка похожести по токенам (Фамилия/Имя)
    function namesSimilar(a, b) {
      if (!a || !b) return false;
      const na = String(a).toLowerCase().replace(/[^\p{L}\s]/gu, '').trim();
      const nb = String(b).toLowerCase().replace(/[^\p{L}\s]/gu, '').trim();
      if (na === nb) return true;
      const ta = na.split(/\s+/).filter(Boolean);
      const tb = nb.split(/\s+/).filter(Boolean);
      if (ta.length === 0 || tb.length === 0) return false;
      const common = ta.filter(x => tb.includes(x)).length;
      const ratio = common / Math.max(ta.length, tb.length);
      // если совпало >= 0.6 токенов — считаем похожими
      return ratio >= 0.6;
    }

    // Получение результатов
    async function loadLeaderboard() {
      if (!SCRIPT_URL || SCRIPT_URL === "ВСТАВЬТЕ_СЮДА_URL_WEB_APP") {
        leaderboardBody.innerHTML = `<tr><td colspan="5" class="empty-state">Укажите SCRIPT_URL в файле index.html</td></tr>`;
        statusText.textContent = "Не настроен SCRIPT_URL";
        return;
      }

      try {
        const response = await fetch(SCRIPT_URL);
        const json = await response.json();
        
        if (json.data && json.data.length > 0) {
          // Сохраняем данные локально (добавим индекс/pos если нет)
          leaderboardData = json.data.map((item, i) => {
            return Object.assign({}, item, { _index: i, pos: item.pos || (i+1) });
          });

          leaderboardBody.innerHTML = leaderboardData.map(item => `
            <tr>
              <td class="pos-col">${item.pos}</td>
              <td>${escapeHtml(item.name)}</td>
              <td>${escapeHtml(normalizePhone(item.phone))}</td>
              <td class="time-cell">${escapeHtml(item.lapTime)}</td>
              <td class="comment-cell">${escapeHtml(item.comment || '')}</td>
            </tr>
          `).join('');
        } else {
          leaderboardBody.innerHTML = `<tr><td colspan="5" class="empty-state">Записей пока нет</td></tr>`;
          leaderboardData = [];
        }
        statusText.textContent = "Онлайн • Автообновление (10с)";
      } catch (err) {
        statusText.textContent = "Ошибка обновления";
      }
    }

    // Отправка формы
    lapForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Сохранение...";

      const rawName = document.getElementById('name').value.trim();
      const rawPhone = document.getElementById('phone').value;
      const rawLap = document.getElementById('lapTime').value.trim().replace(',', '.');
      const rawComment = document.getElementById('comment').value.trim();

      const normPhone = normalizePhone(rawPhone);
      const newTimeMs = timeToMs(rawLap);

      // Поиск похожих/совпадающих записей по имени (и/или телефону)
      let found = null;
      for (const item of leaderboardData) {
        if (namesSimilar(item.name, rawName) || (item.phone && normalizePhone(item.phone) && normalizePhone(item.phone) === normPhone)) {
          found = item;
          break;
        }
      }

      if (found) {
        const existingTimeMs = timeToMs(found.lapTime);
        const msgLines = [
          `Найдена похожая запись: ${found.name}`,
          `Текущее время: ${found.lapTime}`,
          `Новое время: ${rawLap}`,
          ``,
          `Заменить найденную запись новой?`
        ];
        const confirmReplace = confirm(msgLines.join('\n'));
        if (!confirmReplace) {
          // Пользователь отказался заменять — прерываем, чтобы не создавать дубль
          submitBtn.disabled = false;
          submitBtn.textContent = "Отправить результат";
          return;
        }
        // Пользователь подтвердил замену — добавляем метку replace
      }

      const payload = {
        name: rawName,
        phone: normPhone,
        lapTime: rawLap,
        comment: rawComment
      };

      if (found) {
        payload.replace = true;
        payload.replaceName = found.name;
        payload.replacePhone = found.phone || '';
        // Если есть индекс/pos — добавим для надёжности
        if (typeof found.pos !== 'undefined') payload.replacePos = found.pos;
        if (typeof found._index !== 'undefined') payload.replaceIndex = found._index;
      }

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        lapForm.reset();
        submitBtn.textContent = "Отправлено!";
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = "Отправить результат";
          loadLeaderboard();
        }, 1200);

      } catch (err) {
        alert("Ошибка при отправке данных");
        submitBtn.disabled = false;
        submitBtn.textContent = "Отправить результат";
      }
    });

    function escapeHtml(text) {
      return String(text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadLeaderboard();
    setInterval(loadLeaderboard, 10000);
  </script>
</body>
</html>
